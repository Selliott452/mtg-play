name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compile + test + lint, all modules)
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace
