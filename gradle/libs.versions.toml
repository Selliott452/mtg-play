# Version catalog — single source of truth for dependency and plugin versions.
# Verified to resolve against Maven Central / Gradle Plugin Portal on 2026-07-20.

[versions]
kotlin = "2.4.10"
kotest = "6.2.2"
kotlinxCollectionsImmutable = "0.5.1"
# mtg-pauper reads the staged Scryfall snapshot through the JsonElement tree API (no plugin
# needed there); mtg-protocol uses @Serializable DTOs and applies the serialization compiler
# plugin (pre-warmed into the local cache by the architect for offline agent builds, P7.1).
# 1.4.1 pinned since P6.1; the plugin version tracks the Kotlin version.
kotlinxSerialization = "1.4.1"
detekt = "1.23.8"
ktlint = "14.2.0"
# Reference server + client transport (ADR-008 amendment: dependency-isolated in mtg-server,
# never in the mtg-protocol schema artifact). Pre-warmed into the offline cache (P7.2).
ktor = "3.2.2"

[libraries]
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { group = "io.ktor", name = "ktor-server-websockets", version.ref = "ktor" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }

kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }

# Plugin artifacts consumed by the `buildSrc` convention plugin so it can apply them by id.
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradlePlugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlint" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
